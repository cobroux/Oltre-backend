services:
  mysql:
    image: mysql:8.4
    container_name: oltre-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: oltre
      MYSQL_USER: oltre
      MYSQL_PASSWORD: oltre
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: