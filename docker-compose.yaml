services:
  mysql:
    image: mysql:8.4
    container_name: oltre-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: oltre
      MYSQL_USER: oltre
      MYSQL_PASSWORD: oltre
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uoltre", "-poltre"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: oltre-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/oltre
      SPRING_DATASOURCE_USERNAME: oltre
      SPRING_DATASOURCE_PASSWORD: oltre
      GARMIN_SERVICE_URL: ${GARMIN_SERVICE_URL}
      GARMIN_SERVICE_TOKEN: ${GARMIN_SERVICE_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:4200}
      # Laissé vide par défaut (Coach IA reste inactif, 503 clair) -
      # ANTHROPIC_MODEL n'est volontairement pas passé ici : le fournir avec
      # une valeur vide écraserait le défaut applicatif dans
      # application.properties. Pour changer de modèle, ajoute la variable
      # ici toi-même une fois que tu as une clé.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8080:8080"

  # Assumes oltre-frontend is cloned as a sibling directory of this repo,
  # e.g.:
  #   some-folder/
  #     Oltre-backend/   (this repo)
  #     oltre-frontend/
  # Adjust the build context below if your layout differs.
  frontend:
    build: ../oltre-frontend
    container_name: oltre-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_URL: ${API_URL:-http://localhost:8080}
    ports:
      - "4200:80"

volumes:
  mysql_data:
