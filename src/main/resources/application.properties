spring.datasource.url=jdbc:mysql://localhost:3306/oltre
spring.datasource.username=oltre
spring.datasource.password=oltre
spring.jpa.hibernate.ddl-auto=update

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# NB: DEBUG here logs full HTTP bodies, including the Garmin password sent
# to POST /api/garmin/{userId}/connect. Keep at INFO outside of local,
# short-lived debugging.
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.servlet.DispatcherServlet=INFO


app.usda.api-key=${USDA_API_KEY:idjco6oBAVONPWE6ta92xL7KqWailsH5Sx4YhmY7}

# Base URL + shared-secret token of the garmin-mcp REST sidecar
# (cobroux/garmin-mcp, main branch). Override with GARMIN_SERVICE_URL /
# GARMIN_SERVICE_TOKEN in deployment (the token must match GARMIN_API_TOKEN
# set on the sidecar itself).
garmin.service-url=${GARMIN_SERVICE_URL:http://localhost:8000}
garmin.service-token=${GARMIN_SERVICE_TOKEN:}

# No insecure default: a committed default would let anyone who's ever
# had repo access forge valid JWTs for any user. Must be set via env var.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=86400000