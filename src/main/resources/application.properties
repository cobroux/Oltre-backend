spring.datasource.url=jdbc:mysql://localhost:3306/oltre
spring.datasource.username=oltre
spring.datasource.password=oltre
# Le schéma est géré par les migrations Flyway ; Hibernate vérifie seulement
# qu'il correspond aux entités (démarrage refusé sinon).
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Bases créées avant Flyway (par Hibernate) : marquées en V1 sans rejouer V1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# NB: DEBUG here logs full HTTP bodies, including the Garmin password sent
# to POST /api/garmin/{userId}/connect. Keep at INFO outside of local,
# short-lived debugging.
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.servlet.DispatcherServlet=INFO


# OpenFoodFacts product search (for the meal planner's calorie/macro
# lookup). Free, no API key - fr.* for French-relevant results by
# default. Requires a descriptive User-Agent per their usage policy:
# https://openfoodfacts.github.io/openfoodfacts-server/api/ref-cgi/
openfoodfacts.base-url=${OPENFOODFACTS_BASE_URL:https://fr.openfoodfacts.org}
openfoodfacts.user-agent=${OPENFOODFACTS_USER_AGENT:Oltre - Personal Dashboard - https://github.com/cobroux/Oltre-backend}

# Base URL + shared-secret token of the garmin-mcp REST sidecar
# (cobroux/garmin-mcp, main branch). Override with GARMIN_SERVICE_URL /
# GARMIN_SERVICE_TOKEN in deployment (the token must match GARMIN_API_TOKEN
# set on the sidecar itself).
garmin.service-url=${GARMIN_SERVICE_URL:http://localhost:8000}
garmin.service-token=${GARMIN_SERVICE_TOKEN:}

# Coach IA : génère une analyse + un plan hebdomadaire via l'API Gemini
# (tier gratuit, contrairement à l'API Anthropic qui n'en a pas - adapté à
# un usage perso + quelques utilisateurs du site). Optionnelle - sans clé,
# POST /api/coach/plan/generate renvoie une erreur 503 claire ("Coach IA pas
# encore configuré") plutôt que d'échouer silencieusement ou de planter.
# Jamais commitée en dur : doit être fournie via la variable
# d'environnement GEMINI_API_KEY (clé gratuite sur https://aistudio.google.com/apikey).
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.8-flash}

# No insecure default: a committed default would let anyone who's ever
# had repo access forge valid JWTs for any user. Must be set via env var.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=86400000

# Comma-separated list of origins allowed to call the API via CORS.
# Defaults to local dev; set ALLOWED_ORIGINS to the real frontend
# origin(s) (e.g. https://app.example.com) in production.
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200}

# Swagger UI / OpenAPI JSON are public (SecurityConfig permits them without
# auth) so they're reachable during local dev without a token. That also
# means anyone can browse the full API surface (paths, DTOs) in production
# unless this is turned off - set SWAGGER_ENABLED=false in prod deployment.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
# Derrière Caddy (docker-compose.prod), l'IP réelle du client arrive dans
# X-Forwarded-For : sans ceci, toutes les requêtes semblent venir de Caddy
# et le verrouillage de connexion par IP ne fonctionnerait pas. Tomcat ne
# fait confiance à cet en-tête que s'il vient d'une IP de réseau privé.
server.forward-headers-strategy=native
