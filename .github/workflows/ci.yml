name: CI Spring Boot

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Plus besoin de service MySQL — Testcontainers le gère !

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run tests
        run: mvn test

      - name: Build
        run: mvn package -DskipTests