name: CI MySQL Spring Boot

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: oltre
          MYSQL_USER: oltre
          MYSQL_PASSWORD: oltre
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Wait for MySQL
        run: sleep 20

      - name: Run tests
        run: mvn test
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/oltre
          SPRING_DATASOURCE_USERNAME: oltre
          SPRING_DATASOURCE_PASSWORD: oltre

      - name: Build
        run: mvn clean package -DskipTests